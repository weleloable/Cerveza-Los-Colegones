<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>Cerveza LOS COLEGONES</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">

    <header class="topbar">
      <h1>🍺 LOS COLEGONES</h1>
      <button id="btn-sonido" class="chip" title="Activar sonido de alarma">🔈 Activar sonido</button>
    </header>

    <section class="controles-top">
      <select id="select-receta" aria-label="Receta"></select>
      <button id="btn-sync" class="btn secundario" title="Releer la receta por si la has editado">↻</button>
      <button id="btn-reiniciar" class="btn secundario">🔄 Reiniciar</button>
    </section>

    <div class="progreso"><div id="barra-progreso" class="progreso-relleno"></div></div>

    <main id="contenido">
      <h2 id="titulo-paso">Paso 1</h2>

      <div class="tarjeta objetivo">
        <span class="etiqueta">Objetivo</span>
        <div id="valor-objetivo" class="valor-grande">-</div>
      </div>

      <div id="instruccion" class="instruccion">-</div>

      <div id="alerta-banner" class="alerta-banner oculto">
        🚨 ¡ATENCIÓN REQUERIDA!
        <button id="btn-repetir-sonido" class="btn">🔊 Repetir sonido</button>
      </div>

      <div id="zona-dinamica"></div>
    </main>

    <footer class="nav">
      <button id="btn-anterior" class="btn secundario">⬅️ Anterior</button>
      <button id="btn-siguiente" class="btn primario" disabled>Siguiente ➡️</button>
    </footer>
  </div>

  <div id="modal-celebracion" class="modal oculto">
    <div class="modal-contenido">
      <img src="../FotoEquipo.jpeg" alt="Equipo" onerror="this.style.display='none'">
      <h2>¡LOTE TERMINADO CON ÉXITO! 🍻</h2>
      <p>¡Felicidades Colegón! El proceso ha finalizado correctamente.</p>
      <button id="btn-cerrar-modal" class="btn primario">Cerrar</button>
    </div>
  </div>

  <audio id="audio-alarma" preload="auto">
    <source src="../Heartsteel_trigger_SFX_2.ogg" type="audio/ogg">
  </audio>

  <script src="./app.js"></script>
</body>
</html>
